name: CI

# Runs the same checks `make check` runs locally, plus a real container build,
# so a pull request cannot merge something that only works on one machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker:
    name: Container builds and serves
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The container writes gbd.db into the bind-mounted ./data -- a checkout
      # directory owned by the runner, whose ownership the image cannot change.
      # Running as any other UID cannot write there, so the entrypoint aborts
      # and the app never answers. GBD_UID/GBD_GID are set inline rather than
      # in a job-level `env:`, which would take precedence over $GITHUB_ENV.
      # `make up` does the same thing from `id -u` / `id -g`.
      # A throwaway account for this run only; the password is masked in logs.
      - name: Prepare a sign-in for the smoke test
        run: |
          password=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$password"
          echo "SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SMOKE_EMAIL=ci-smoke@example.org" >> "$GITHUB_ENV"

      - name: Build and start
        run: |
          echo "runner $(id -u):$(id -g) | ./data owned by $(stat -c '%u:%g' data)"
          GBD_UID=$(id -u) GBD_GID=$(id -g) docker compose up -d --build

      - name: Wait for the app, then smoke test it
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          printf '%s\n' "$SMOKE_PASSWORD" \
            | docker compose exec -T app python -m app.accounts add "$SMOKE_EMAIL" --password-stdin
          make smoke

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
