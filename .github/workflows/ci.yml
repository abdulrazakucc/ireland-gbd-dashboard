name: CI

# Runs the same checks `make check` runs locally, plus a real container build,
# so a pull request cannot merge something that only works on one machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  docker:
    name: Container builds and serves
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The container writes gbd.db into the bind-mounted ./data -- a checkout
      # directory owned by the runner, whose ownership the image cannot change.
      # Running as any other UID cannot write there, so the entrypoint aborts
      # and the app never answers. GBD_UID/GBD_GID are set inline rather than
      # in a job-level `env:`, which would take precedence over $GITHUB_ENV.
      # `make up` does the same thing from `id -u` / `id -g`.
      - name: Build and start
        run: |
          echo "runner $(id -u):$(id -g) | ./data owned by $(stat -c '%u:%g' data)"
          GBD_UID=$(id -u) GBD_GID=$(id -g) docker compose up -d --build

      - name: Wait for the app, then smoke test it
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          make smoke

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
