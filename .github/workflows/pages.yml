name: Deploy dashboard to GitHub Pages

# GitHub Pages serves files, not processes, so there is nothing there to answer
# a request to /api/.... scripts/build_static_site.py runs the real application
# in memory, exports every answer the dashboard asks for, and publishes those
# files alongside it -- see the "Published dashboard" section of the README.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, mint the Pages deployment token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two snapshots at once, and let a newer commit supersede an
# in-flight run rather than queueing behind it. `cancel-in-progress: false`
# would be wrong here: a half-finished deployment is not worth protecting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The snapshot is generated by driving the real app, so if the API is
      # broken the snapshot is broken. Fail here rather than publish it.
      - name: Test
        run: pytest

      - name: Build the static snapshot
        run: python -m scripts.build_static_site --out site

      # A snapshot that is missing a file the dashboard fetches would publish
      # a page that looks fine and renders empty charts. Check before upload.
      - name: Verify the snapshot is complete
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          test -f site/404.html
          grep -q 'window.API_MODE = "static"' site/config.js
          for route in health meta series dimensions manifest ranked/options; do
            test -s "site/api/$route.json"
          done
          python - <<'PY'
          import json, pathlib, sys
          api = pathlib.Path("site/api")
          ids = [s["series_id"] for s in json.loads((api / "series.json").read_text())]
          if not ids:
              sys.exit("no series in the snapshot")
          wanted = [
              api / f"{kind}/{sid}.{ext}"
              for sid in ids
              for kind, ext in (("trend", "json"), ("export", "csv"), ("figure", "png"), ("figure", "pdf"))
          ]
          wanted += [api / o["file"] for o in json.loads((api / "ranked/options.json").read_text())]
          missing = [str(p) for p in wanted if not p.is_file() or p.stat().st_size == 0]
          if missing:
              sys.exit("incomplete snapshot: " + ", ".join(missing[:20]))
          print(f"Snapshot verified: {len(ids)} series, {len(wanted)} data files")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
