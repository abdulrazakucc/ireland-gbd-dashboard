name: Deploy site to GitHub Pages

# A static site cannot check who is asking -- every file on GitHub Pages is
# public -- so what this publishes is one of two shapes:
#
#   * no GBD_USERS_JSON secret: the public landing page only;
#   * with GBD_USERS_JSON: the landing page plus the application, whose results
#     are encrypted and open only in the browser of someone signing in with an
#     account from that file. See scripts/build_static_site.py.
#
# To give someone access: `make user-add EMAIL=...` locally, then set the
# repository secret GBD_USERS_JSON (Settings -> Secrets and variables ->
# Actions) to the output of `make user-export`, and re-run this workflow.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository and its build artifact, then mint the Pages deployment
# token. No repository write permission is granted.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never publish two builds at once, and let a newer commit supersede an
# in-flight run rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest

      - name: Build the site
        env:
          GBD_USERS_JSON: ${{ secrets.GBD_USERS_JSON }}
          GBD_APP_URL: ${{ vars.GBD_APP_URL }}
        run: python -m scripts.build_static_site --out site

      # Defence in depth: fail rather than publish a readable result.
      - name: Verify what is published
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          site = pathlib.Path("site")
          files = sorted(str(p.relative_to(site)) for p in site.rglob("*") if p.is_file())
          landing = {".nojekyll", "404.html", "index.html", "assets/ucc-logo.png", "assets/zubair-kabir.png"}
          if (site / "api").exists():
              sys.exit("An api/ directory must never be published")
          if not (site / "app").exists():
              if set(files) != landing:
                  sys.exit(f"Unexpected files: {sorted(set(files) ^ landing)}")
              print("Verified: landing page only")
              sys.exit(0)
          if not (site / "app/data.sealed").read_bytes().startswith(b"GBDS1"):
              sys.exit("The results are not sealed")
          keys = json.loads((site / "app/keys.json").read_text())
          fields = {"id", "salt", "iterations", "nonce", "wrapped"}
          if not keys["users"] or any(set(entry) != fields for entry in keys["users"]):
              sys.exit("Unexpected account entries in keys.json")
          for name in files:
              if name != "app/data.sealed" and b'"series_id":' in (site / name).read_bytes():
                  sys.exit(f"{name} contains readable results")
          print(f"Verified: landing page and sealed application for {len(keys['users'])} account(s)")
          PY

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
