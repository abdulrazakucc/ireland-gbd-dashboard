name: Deploy dashboard to GitHub Pages

# GitHub Pages serves files, not processes, so there is nothing there to answer
# a request to /api/.... scripts/build_static_site.py runs the real application
# in memory, exports every answer the dashboard asks for, and publishes those
# files alongside it -- see the "Published dashboard" section of the README.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, mint the Pages deployment token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two snapshots at once, and let a newer commit supersede an
# in-flight run rather than queueing behind it. `cancel-in-progress: false`
# would be wrong here: a half-finished deployment is not worth protecting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The snapshot is generated by driving the real app, so if the API is
      # broken the snapshot is broken. Fail here rather than publish it.
      - name: Test
        run: pytest

      - name: Build the static snapshot
        run: python -m scripts.build_static_site --out site

      # A snapshot that is missing a file the dashboard fetches would publish
      # a page that looks fine and renders empty charts. Check before upload.
      - name: Verify the snapshot is complete
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          test -f site/404.html
          grep -q 'window.API_MODE = "static"' site/config.js
          for route in health meta indicators manifest; do
            test -s "site/api/$route.json"
          done
          for type in causes risks; do
            test -s "site/api/ranked/$type.json"
          done
          python - <<'PY'
          import json, pathlib, sys
          site = pathlib.Path("site")
          ids = [i["indicator_id"] for i in json.loads((site / "api/indicators.json").read_text())]
          if not ids:
              sys.exit("no indicators in the snapshot")
          missing = [
              str(p) for i in ids
              for p in (site / f"api/trend/{i}.json", site / f"api/export/{i}.csv")
              if not p.is_file() or p.stat().st_size == 0
          ]
          if missing:
              sys.exit("incomplete snapshot: " + ", ".join(missing))
          print(f"Snapshot verified: {len(ids)} indicators, {sum(1 for _ in site.rglob('*') if _.is_file())} files")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
