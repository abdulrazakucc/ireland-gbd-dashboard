name: Deploy landing page to GitHub Pages

# GitHub Pages hosts the public landing page ONLY. GBD results are available
# only to approved users of the application, and a static site cannot check
# who is asking -- every file on Pages is public -- so no estimate, export,
# figure or dashboard code is ever published here. scripts/build_static_site.py
# refuses to write anything else, and the verify step below checks again.
#
# Access links: set the repository variable GBD_APP_URL (Settings -> Secrets
# and variables -> Actions -> Variables) to the hosted application's address,
# and the landing page's "Request access" / "Sign in" buttons point there.
# Until it is set, the page says access opens when the application launches.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository and its build artifact, then mint the Pages deployment
# token. No repository write permission is granted.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never publish two builds at once, and let a newer commit supersede an
# in-flight run rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest

      - name: Build the landing page
        env:
          GBD_APP_URL: ${{ vars.GBD_APP_URL }}
        run: python -m scripts.build_static_site --out site

      # Defence in depth: fail rather than publish a single result file.
      - name: Verify nothing but the landing page is published
        run: |
          set -euo pipefail
          test -f site/index.html
          test ! -e site/api
          published=$(cd site && find . -type f | LC_ALL=C sort | tr '\n' ' ')
          expected="./.nojekyll ./404.html ./assets/ucc-logo.png ./assets/zubair-kabir.png ./index.html "
          if [ "$published" != "$expected" ]; then
            echo "Unexpected files in site/: $published"
            exit 1
          fi
          if grep -q -e '/api/' -e 'chart.umd.js' site/index.html; then
            echo "The landing page references results or dashboard code"
            exit 1
          fi
          echo "Verified: landing page only"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
