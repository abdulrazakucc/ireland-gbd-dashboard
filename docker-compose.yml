# One service serves both halves of the product on a single port.
#   http://localhost:8000/        the dashboard
#   http://localhost:8000/api/..  the JSON API
#
# Start with: make up      Stop with: make down

services:
  app:
    build: .
    image: ucc-gbd-dashboard:latest
    container_name: ucc-gbd-app
    ports:
      # GBD_PORT lets a caller move the host-side port when 8000 is already
      # taken -- scripts/install.ps1 sets it automatically. Inside the
      # container the app is always on 8000.
      - "${GBD_PORT:-8000}:8000"
    # Run as the user who owns ./data on the host. The data directory is a
    # bind mount, so the container writes gbd.db into a host directory whose
    # ownership the image cannot change. A mismatched UID makes that write
    # fail, which is invisible on Docker Desktop (it translates ownership)
    # and fatal on Linux. `make up` fills these in from `id -u` / `id -g`;
    # the 1000 default is the first non-root user on a typical Linux desktop.
    # Still non-root either way, so the Dockerfile's appuser intent stands.
    user: "${GBD_UID:-1000}:${GBD_GID:-1000}"
    environment:
      # The database lives in the mounted data volume, so the container and
      # the host share one file: `make refresh` on the host is visible here
      # without a rebuild.
      GBD_DB_PATH: /srv/data/gbd.db
    volumes:
      - ./data:/srv/data
      # Read-only: the dashboard is served, never written to. Mounting it means
      # frontend edits show on refresh with no rebuild.
      - ./static:/srv/static:ro
    restart: unless-stopped
