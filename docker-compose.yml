# One service serves both halves of the product on a single port.
#   http://localhost:8000/        the dashboard
#   http://localhost:8000/api/..  the JSON API
#
# Start with: make up      Stop with: make down

services:
  app:
    build: .
    image: ucc-gbd-dashboard:latest
    container_name: ucc-gbd-app
    ports:
      - "8000:8000"
    environment:
      # The database lives in the mounted data volume, so the container and
      # the host share one file: `make refresh` on the host is visible here
      # without a rebuild.
      GBD_DB_PATH: /srv/data/gbd.db
    volumes:
      - ./data:/srv/data
      # Read-only: the dashboard is served, never written to. Mounting it means
      # frontend edits show on refresh with no rebuild.
      - ./static:/srv/static:ro
    restart: unless-stopped
