# Tool configuration. There is no build step -- this file exists so that
# ruff and pytest are configured identically for everyone, including CI.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "static"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
]
# `type` shadows a builtin, but it is the public query-parameter name the
# dashboard already calls; renaming it would break the API.
ignore = ["A002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of a test

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
