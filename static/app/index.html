<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Health Evidence · Workspace</title>
<meta name="description" content="Global Burden of Disease analysis workspace, School of Public Health, University College Cork.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2942">
<!--
  The application shell. It holds no results: every figure is fetched after
  sign-in -- from the API when served by the application, or decrypted in the
  browser from the sealed copy on GitHub Pages. All scripts are external files,
  so the policy below needs no inline-script exception.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<link rel="icon" href="../assets/ucc-logo.png">
<link rel="stylesheet" href="app.css">
<script src="theme-init.js"></script>
</head>
<body>
<div id="root">
  <div class="boot" role="status" aria-live="polite">
    <img class="boot-logo" src="../assets/ucc-logo.png" alt="">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading Global Health Evidence&hellip;</p>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p class="noscript">Global Health Evidence needs JavaScript enabled.</p></noscript>
<script src="../assets/chart.umd.js"></script>
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
